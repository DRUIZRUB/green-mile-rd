name: Verify & Deploy Firebase Hosting & Firestore Rules

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Verify Build, Syntax & Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          for f in public/js/*.js functions/index.js functions/src/*/*.js functions/src/*.js scripts/*.mjs; do
            [ -f "$f" ] || continue
            node --check "$f"
          done

      - name: Build static equipment pages & sitemap
        run: |
          npm run build:pages
          test -s public/robots.txt
          test -s public/sitemap.xml

      - name: Install Cloud Functions dependencies & run smoke tests
        run: |
          npm --prefix functions ci --no-audit --no-fund
          npm run functions:test

  deploy_live:
    name: Deploy to Firebase Production
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static equipment pages & sitemap
        run: npm run build:pages

      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'studio-8139121026-17b90' }}
        run: npx --yes firebase-tools deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Deploy Firestore Rules via Admin SDK
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npm --prefix functions ci --omit=dev --no-audit --no-fund
          node scripts/deploy-firestore-rules.mjs

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
